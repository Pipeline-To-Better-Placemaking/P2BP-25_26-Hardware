%YAML:1.0
# laptop/deepstream/config_tracker_NvMOT.yml
#
# NvMultiObjectTracker configuration for the DS 9.0 MV3DT laptop pipeline.
# Enables NvDCF (IOU + appearance) + ReID + SV3DT + MV3DT so a single
# deepstream-app can produce both per-camera 3D tracks and fused multi-view
# global IDs on localhost Mosquitto.
#
# Schema verified via the deepstream-9-docs skill:
#   - Context7 /websites/nvidia_metropolis_deepstream_dev-guide
#   - WebFetch https://docs.nvidia.com/metropolis/deepstream/dev-guide/text/DS_plugin_gst-nvtracker.html
#   - WebFetch https://docs.nvidia.com/metropolis/deepstream/dev-guide/text/DS_MV3DT.html
#   - Sample: NVIDIA-AI-IOT/deepstream_reference_apps/deepstream-tracker-3d-multi-view
#
# calibrationDirectory is populated by laptop/scripts/40_export_watcher.sh
# from AMC's export (Notion §8.7). The rendered deepstream_app_config.txt
# points `ll-config-file` at this file from
# laptop/deepstream/ working directory, so paths are relative to that
# directory.

BaseConfig:
  minDetectorConfidence: 0.4
  checkClassMatch: 1

TargetManagement:
  preserveStreamUpdateOrder: 0
  maxShadowTrackingAge: 80
  probationAge: 3
  earlyTerminationAge: 1

TrajectoryManagement:
  useUniqueID: 1

DataAssociator:
  dataAssociatorType: 0
  associationMatcherType: 1
  minMatchingScore4Overall: 0.0
  minMatchingScore4SizeSimilarity: 0.4
  minMatchingScore4Iou: 0.1

StateEstimator:
  stateEstimatorType: 1
  processNoiseVar4Loc: 2.0
  processNoiseVar4Size: 1.0
  processNoiseVar4Vel: 0.1
  measurementNoiseVar4Detector: 4.0
  measurementNoiseVar4Tracker: 16.0

VisualTracker:
  visualTrackerType: 1
  useColorNames: 1
  useHog: 1
  featureImgSizeLevel: 2

ReID:
  reidType: 2    # The type of reid among { DUMMY=0, NvDEEPSORT=1, Reid based reassoc=2, both NvDEEPSORT and reid based reassoc=3}

  # [Reid Network Info]
  batchSize: 100    # Batch size of reid network
  workspaceSize: 1000    # Workspace size to be used by reid engine, in MB
  reidFeatureSize: 256    # Size of reid feature
  reidHistorySize: 100    # Max number of reid features kept for one object
  inferDims: [3, 256, 128]    # Reid network input dimension CHW or HWC based on inputOrder
  networkMode: 1    # Reid network inference precision mode among {fp32=0, fp16=1, int8=2 }

  # [Input Preprocessing]
  inputOrder: 0    # Reid network input order among { NCHW=0, NHWC=1 }. Batch will be converted to the specified order before reid input.
  colorFormat: 0    # Reid network input color format among {RGB=0, BGR=1 }. Batch will be converted to the specified color before reid input.
  offsets: [123.6750, 116.2800, 103.5300]    # Array of values to be subtracted from each input channel, with length equal to number of channels
  netScaleFactor: 0.01735207    # Scaling factor for reid network input after substracting offsets
  keepAspc: 1    # Whether to keep aspc ratio when resizing input objects for reid
  useVPICropScaler: 1 # Use VPI for image cropping and rescaling

  # [Output Postprocessing]
  addFeatureNormalization: 1       # If reid feature is not normalized in network, adding normalization on output so each reid feature has l2 norm equal to 1
  minVisibility4GalleryUpdate: 0.6 # Add ReID embedding to the gallery only if the visibility is not lower than this

  # [Paths and Names]
  # Relative to the pipeline working directory (<install_dir>/deepstream).
  # Step 4 downloads the .etlt; DeepStream builds the engine on first start.
  tltEncodedModel: "models/reid/resnet50_market1501.etlt" # NVIDIA TAO model path
  tltModelKey: "nvidia_tao" # NVIDIA TAO model key
  modelEngineFile: "models/reid/resnet50_market1501.etlt_b100_gpu0_fp16.engine" # Engine file path

# Single-View 3D Tracking. AMC (§8.6 Execute + §8.7 Export) writes one
# per-camera calibration YAML under calibration/<LOCATION_ID>/camera<N>.yml.
SV3DT:
  enable: 1
  calibrationDirectory: calibration/${LOCATION_ID}
  projectionType: homography

# Multi-View 3D Tracking. Each laptop publishes sv3d per-camera tracks and
# listens for peers on the same broker; with a single laptop in this harness
# MV3DT fuses the 8 local SV3DT streams into a global ID space. The broker
# auth/topic base are consumed from env at render-time by 40_export_watcher.sh.
MV3DT:
  enable: 1
  mqttBrokerIP: 127.0.0.1
  mqttBrokerPort: 1883
  nodeID: ${LOCATION_ID}
  fusionUpdateRate: 30
  globalIDNegotiationTimeout: 100
