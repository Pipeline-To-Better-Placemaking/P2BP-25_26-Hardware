# Base configuration for automating AutoMagicCalib (AMC) 3.3.0.
#
# This file ships inside the mv3dt_amc_control package and is the base every
# run starts from. Installer Step 9 replaces it on upgrade, so do NOT edit it.
# To change a setting on a workstation, edit
#   <install_dir>/amc_control/amc_automation.yaml
# (created by Step 9, never replaced) and add only the keys you change; they
# are merged on top of this file. Check the result with
#   cd <install_dir>/amc_control && venv/bin/python3 -m mv3dt_amc_control check-config
#
# Where values come from, in order:
#   1. The project's database record, sent by the web app as a signed spec
#      (project title, floor plan image, floor plan scale).
#   2. This file and the override file.
#   3. AMC's own defaults.
#
# AMC's REST API is documented in NVIDIA's amc-run-video-calibration skill
# (github.com/NVIDIA/DeepStream, skills/amc-run-video-calibration). The
# rectification endpoints used by rectification.mode auto and linear are not in
# that documentation; they come from AMC 3.3.0's own API description, which
# you can read from the running AMC with:
#   cd <install_dir>/amc_control && venv/bin/python3 -m mv3dt_amc_control openapi > amc-openapi.yaml

amc:
  # Start AMC (bin/amc --keep-up) when a run begins and it is not up yet.
  start_if_down: true
  # Seconds to wait for AMC to report ready. The first launch downloads
  # several gigabytes, so this is long on purpose.
  ready_timeout_seconds: 1800
  # API base URL. Empty means http://127.0.0.1:<AUTO_MAGIC_CALIB_MS_PORT>/v1
  # from installer.conf.
  api_base_url: ""
  request_timeout_seconds: 60
  upload_timeout_seconds: 600

# AMC step 1: Project Setup
project:
  # reuse_installer_project: recalibrate the AMC project named by AMC_PROJECT_ID
  #   in installer.conf. The installer's ingest timer then picks up the new
  #   result automatically, so this is the normal choice.
  # create_new: create a fresh AMC project for every run. The installer does
  #   not ingest these on its own; use results.download_dir to collect them.
  # web_project: lock every run to the calling web project's workstation
  #   folder (<AMC_PROJECTS_DIR>/<folder>/) and the AMC project made when that
  #   folder was set up. A project that is not set up is refused, and a deleted
  #   AMC project fails the run instead of being recreated. Footage comes from
  #   <folder>/footage/ (videos.pattern and videos.order still apply, videos.source
  #   does not); the floor plan is kept as <folder>/floorplan/layout.png;
  #   alignment.file auto prefers <folder>/alignment/alignment_data.json;
  #   results always go to <folder>/calibration/<UTC time>/ (results.download_dir
  #   is not used); every finished run is recorded in <folder>/runs/<job id>.json.
  #   name_template is not used.
  mode: reuse_installer_project
  # Name used when a project is created. Placeholders: {title} (project title
  # from the database), {project_id} (web app project id), {date} (YYYYMMDD).
  name_template: "{title}-{date}"

# AMC step 2: Video Configuration (videos and layout image)
videos:
  enabled: true
  # "installer" reads the footage folder the installer records into:
  #   <CALIB_FOOTAGE_DIR or ~/Downloads/mv3dt-calibration-footage>/<PROJECT_NAME>/
  # Anything else is used as a folder path.
  source: installer
  pattern: "*.mp4"
  # AMC numbers cameras by upload order and needs cam_00.mp4, cam_01.mp4, ...
  # Files are uploaded under those names. Order is alphabetical by file name
  # unless you list the file names here in the order you want.
  order: []

layout:
  enabled: true
  # database: the floor plan attached to the project in the web app.
  # file: always use layout.file below.
  source: database
  file: ""
  # Hosts the workstation may download the floor plan from (the Supabase
  # project host, for example abcdefgh.supabase.co). Downloads from any other
  # host are refused. Empty refuses all downloads.
  allowed_hosts: []
  max_bytes: 26214400

# AMC step 3: Parameters
parameters:
  enabled: true
  # AMC keeps one current configuration (GET /v1/config), not one per project,
  # and POST /v1/config/{id} replaces all of it. So every post is built in
  # this order, each layer replacing the keys it names: AMC's current
  # configuration, then settings_file, then settings_overrides, then
  # scale.settings_key set to the scale. A config is posted even without a
  # settings_file (unless scale.source is none and there is nothing to merge).
  #
  # A settings JSON exported with the Download button on AMC's Parameters
  # step. Empty keeps AMC's current settings. Relative paths are relative to
  # the override file's folder.
  settings_file: ""
  # Changes merged in after settings_file, so you can switch a setting without
  # editing the exported file. Works without a settings_file too: it is merged
  # into AMC's current configuration.
  # Example (key names must match AMC's configuration):
  #   settings_overrides:
  #     detector: transformer
  settings_overrides: {}
  # The floor plan scale, in layout pixels per metre. The first source that
  # has one wins:
  #   database: the floor plan's scale from the web app (1000 / MmPerPixel);
  #     otherwise, in project.mode web_project, the scale remembered in the
  #     folder's project.json, used only when this run uploaded the same
  #     layout.png (same SHA-256), so a new floor plan asks again.
  #   fixed: fixed_px_per_m.
  #   none: the run neither posts nor asks for a scale, and step 6 does not
  #     re-post one; you manage it in AMC yourself.
  # With no scale (database without one) the run posts AMC's factory value
  # (24.22) and waits: set the scale in AMC's Parameters step (measure two
  # points on the floor plan, or enter its pixels per metre), Save, then
  # press Continue. Continue accepts only a positive value that is not the
  # factory default; the run then remembers it with the layout's hash. A
  # floor plan whose true scale is exactly 24.22 cannot be confirmed: enter
  # 24.2201. Before calibrating, step 6 reads AMC's configuration again: a
  # different, non-default value set there during the pause replaces (and is
  # remembered as) the run's scale, which is then posted.
  # Cancelling a web_project run keeps the remembered scale.
  scale:
    source: database
    fixed_px_per_m: 0
    # The key inside AMC's configuration that holds the scale (dotted for a
    # nested key). AMC 3.3.0 calls it layout_px_per_m. A key AMC's
    # configuration does not have fails step 3.
    settings_key: layout_px_per_m
  # One focal length per camera, in pixels, or empty to let AMC estimate them.
  focal_lengths: []

# AMC step 4: Rectification (new in AMC 3.3.0)
rectification:
  # auto: AMC estimates each camera's distortion (POST /v1/rectification/{id}),
  #   and the estimate is committed the way AMC's UI "Generate Rectified
  #   Videos" button does (POST /v1/rectification/{id}/manual), then the run
  #   waits for COMPLETED. It waits until step 2 is done and AMC has the
  #   videos. A run always starts its own rectification (an earlier COMPLETED
  #   may be from replaced footage); on Continue it picks up where its own
  #   rectification is. Right after each request AMC may still report its
  #   earlier state for up to 3 polls, which is tolerated. ERROR or a timeout
  #   fails the step with the end of AMC's rectification log, and Continue
  #   after ERROR starts over. Manual Alignment is asked for only once the run
  #   has rectified.
  # linear: the footage is already rectified; stage it unchanged
  #   (POST /v1/linear_media/{id}) and wait for COMPLETED.
  # Cancelling a web_project run waits while a rectification is RUNNING (up to
  # api.timeout_seconds), since AMC cannot stop one, then deletes the project.
  # ui: pause with the manual step so the user runs it in AMC's UI; Continue
  #   counts it done only once AMC reports the rectification COMPLETED.
  # api: run it with the generic requests below.
  # skip: the project is already rectified.
  mode: auto
  # auto and linear use only poll_seconds and timeout_seconds from here
  # (timeout_seconds applies to each wait: the estimate and the generation
  # each get their own). start and status are for mode api
  # only: fill them in from AMC's /openapi.yaml. {project_id} is replaced with
  # the AMC project id.
  api:
    start:
      method: POST
      path: ""
      json: {}
    status:
      method: GET
      path: ""
      # Dotted path to the state inside the JSON reply.
      state_field: ""
      done_states: [COMPLETED]
      failed_states: [ERROR, FAILED]
    poll_seconds: 10
    timeout_seconds: 1800

# AMC step 5: Manual Alignment (always done by a person the first time)
alignment:
  # A saved alignment_data.json to upload instead of redoing the step, for
  # example after recalibrating the same cameras. "auto" looks for the one AMC
  # saved for the installer's project under
  # <AMC_ROOT>/projects/project_<AMC_PROJECT_ID>/manual_adjustment/.
  # Empty always asks for the manual step; Continue counts it done only once
  # AMC reports a saved alignment file.
  file: auto
  # Files saved by AMC's alignment tool are in rectified pixels. Use original
  # only for points picked on the raw, distorted video.
  coord_space: rectified

# AMC step 6: Execute Calibration
calibration:
  detector_type: transformer   # transformer (default; better under occlusion) or resnet (faster)
  poll_seconds: 10
  timeout_seconds: 5400

# AMC step 7: Results
results:
  # Folder to save AMC's MV3DT result ZIP in. Empty leaves collection to the
  # installer's ingest timer (mode reuse_installer_project).
  download_dir: ""
  result_type: amc
