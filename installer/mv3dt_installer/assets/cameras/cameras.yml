# installer/mv3dt_installer/assets/cameras/cameras.yml
#
# Seed camera inventory bundled into mv3dt-installer (assets/cameras/).
# Synced with deployed fleet: link-local 169.254.*, Hikvision main stream path.
#
# Consumed by the installer:
#   - cameras.py first-run scan: this header is copied into every generated
#     <install_dir>/cameras.yml and the pinned IPs below prime the ARP-cache
#     fallback for MAC discovery (framework doc 00 §15).
#
# Credentials: captured by the installer in secrets/camera.env (not here).
#
# ---------------------------------------------------------------------------
# Fleet hardware facts (harvested from the P2BP camera-node tree before it was
# removed from this fork — see installer/plan/DELETION-REVIEW.md). These are
# the camera facts that existed nowhere else; preserved here because this file
# is the retained camera inventory.
# ---------------------------------------------------------------------------
#
# Vendor / firmware
#   ANNKE cameras running Hikvision-OEM firmware: ISAPI endpoints, the
#   /Streaming/Channels/101 main-stream path used below, and a
#   /doc/page/login.asp web UI. MAC OUI prefix: d0:3b:f4
#
# Fleet MAC inventory (8 cameras). MACs are the STABLE identifier; the
# link-local IPs below are not (see the caveat further down).
#   d0:3b:f4:01:52:79    d0:3b:f4:02:44:84
#   d0:3b:f4:01:52:91    d0:3b:f4:02:44:85
#   d0:3b:f4:01:52:9a    d0:3b:f4:02:44:87
#   d0:3b:f4:01:52:f1    d0:3b:f4:02:44:e2
#   (No MAC-to-position mapping survived: the two source files shared no key.
#    Re-derive with `arp-scan -l` on the camera LAN if the mapping is needed.)
#
# Native sensor resolution: 3072x1728 per camera.
# Main stream (/Streaming/Channels/101) as configured: H.264, 1920x1080 at
#   22 fps (operator, 2026-10-20; previously left at the native 3072x1728).
#   1080p matches AutoMagicCalib's input requirement and the [streammux]
#   width=1920 height=1080 in the bundled deepstream_app_config.txt, so
#   the pipeline no longer downscales; detection still runs at 1080p, not
#   sensor resolution. The stream also carries G.711 mu-law audio, which the
#   installer's footage recorder drops (-an).
#
# CAVEAT — link-local IPs are volatile.
#   These are 169.254.0.0/16 auto-configured addresses, NOT derived from the
#   camera MAC and NOT DHCP-reserved. A previously captured snapshot of four
#   of these cameras recorded a completely disjoint IP set from the one below,
#   so a camera can change address across power cycles. If ping/ffprobe fails
#   for an entry here, re-scan the LAN by MAC before assuming the camera is
#   down. This is why the camera-node stack discovered by MAC rather than
#   trusting a static list.
#
# MANUAL PRE-FLIGHT (required before a camera serves usable video).
#   Per-camera setup is out of scope for the installer (framework doc 00 §13,
#   STEP-5 §9) and must be done by hand in each camera's web UI:
#     1. ACTIVATE the camera. They ship un-activated and refuse RTSP until an
#        admin password is set. Check with:
#          curl -s -o /dev/null -w '%{http_code}' http://<ip>/ISAPI/System/status
#     2. DISABLE OSD TEXT: Configuration -> Image -> OSD Settings -> uncheck
#        "Display Name" and "Display Date" -> Save.
#        This one matters: the overlay is burned into the encoded stream, so
#        leaving it on feeds timestamp/name pixels into PeopleNet detection and
#        into AutoMagicCalib's feature matching.
#
# OPTIONAL PER-CAMERA FIELD — exclude_boxes (hand-edited, kept across rescans).
#   A quoted string of rectangles "left,top,width,height" separated by ";",
#   in whole pixels of that camera's lens-corrected 1920x1080 frame, each
#   rectangle inside the frame, e.g.
#     exclude_boxes: "530,175,245,225"
#   A detection lying entirely inside one rectangle (a TV, a poster) is
#   dropped before the tracker; a box that only overlaps it is kept. Step 4
#   renders it into <install_dir>/deepstream/exclusion.conf; restart
#   mv3dt-pipeline@<slug> to apply. Spec:
#   installer/plan/DETECTION-EXCLUSION-ZONES.md.

cameras:
  - id: c1
    ip: 169.254.9.14
    position: "top-right"
    rtsp_path: /Streaming/Channels/101
    enabled: true
  - id: c2
    ip: 169.254.124.198
    position: "middle-top-right"
    rtsp_path: /Streaming/Channels/101
    enabled: true
  - id: c3
    ip: 169.254.102.152
    position: "middle-top-left"
    rtsp_path: /Streaming/Channels/101
    enabled: true
  - id: c4
    ip: 169.254.33.142
    position: "top-left"
    rtsp_path: /Streaming/Channels/101
    enabled: false
  - id: c5
    ip: 169.254.33.155
    position: "bottom-left"
    rtsp_path: /Streaming/Channels/101
    enabled: false
  - id: c6
    ip: 169.254.19.210
    position: "middle-bottom-left"
    rtsp_path: /Streaming/Channels/101
    enabled: true
  - id: c7
    ip: 169.254.72.24
    position: "middle-bottom-right"
    rtsp_path: /Streaming/Channels/101
    enabled: true
  - id: c8
    ip: 169.254.82.77
    position: "bottom-right"
    rtsp_path: /Streaming/Channels/101
    enabled: true
